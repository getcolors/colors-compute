name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  provider-schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, digitalocean, google, hcloud, oci, vultr, yandex]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.5'
          tofu_wrapper: false
      - name: Validate provider examples without credentials or remote state
        env:
          COMPUTE_SCHEMA_PROVIDER: ${{ matrix.provider }}
        run: python3 "providers/$COMPUTE_SCHEMA_PROVIDER/check.py" --tofu "$(command -v tofu)"
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: '1.13.219'
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.5'
          tofu_wrapper: false
      - run: bun install --frozen-lockfile
        working-directory: red
      - run: python3 scripts/registry.py
      - run: python3 scripts/provider_resources.py
      - run: python3 scripts/provider_recipes.py
      - run: python3 scripts/endpoint_resources.py
      - run: python3 scripts/controller_resources.py
      - run: python3 scripts/execution_resources.py
      - run: python3 scripts/parity.py
      - name: Check native backend readers against local synthetic state
        run: |
          python3 scripts/backend_probe.py --tofu "$(command -v tofu)" --blue-runner
          python3 scripts/backend_http_probe.py
      - name: Check conditional journal writes against local HTTPS storage
        run: |
          aws --version
          python3 scripts/journal_http_probe.py
      - run: uv run --directory blue pytest -q
      - run: bb test
        working-directory: green
      - run: bun test && bun run typecheck
        working-directory: red
      - run: python3 -m unittest discover -s migration -v
      - run: |
          for checker in providers/*/check.py; do
            python3 "$checker"
          done
