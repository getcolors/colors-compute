[project]
name = "colors-compute-blue"
version = "0.1.0"
description = "Shared compute contract for Colors Blue"
requires-python = ">=3.11"
dependencies = ["blue @ git+https://github.com/getcolors/blue.git@290f313ead5ca162875c33a049c880da017eae09"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/colors_compute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
